<meta charset="utf-8"/>
<style>
body { font-family: sans-serif; background: #f0f2f5; display:flex; justify-content:center; align-items:flex-start; padding: 40px 20px; margin:0; min-height:100vh; box-sizing:border-box; }
.card { background:#fff; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.12); padding:28px 28px 24px; width:340px; }
.logo { text-align:center; margin-bottom:20px; }
.logo img { height:52px; max-width:200px; object-fit:contain; }
label { display:block; font-size:11px; color:#6c757d; margin-bottom:3px; margin-top:10px; }
input, select { width:100%; box-sizing:border-box; border:1px solid #ced4da; border-radius:5px; padding:6px 9px; font-size:13px; }
input:focus, select:focus { outline:none; border-color:#cc0000; box-shadow: 0 0 0 2px rgba(204,0,0,.15); }
.url-bar { background:#f8f9fa; border:1px solid #dee2e6; border-radius:5px; padding:6px 10px; display:flex; align-items:center; justify-content:space-between; margin-top:0; cursor:pointer; }
.url-bar span { font-size:12px; color:#495057; }
.url-bar a { font-size:11px; color:#0d6efd; text-decoration:none; white-space:nowrap; }
.url-expanded { display:none; border:1px solid #0d6efd; border-radius:5px; padding:8px 10px; background:#f0f7ff; margin-top:6px; }
.url-expanded.open { display:block; }
.url-expanded input { border-color:#0d6efd; background:#fff; }
.url-expanded .hint { font-size:10px; color:#6c757d; margin-top:3px; }
.btn { width:100%; background:#cc0000; color:#fff; border:none; border-radius:5px; padding:9px; font-size:13px; font-weight:bold; cursor:pointer; margin-top:16px; }
.btn:hover { background:#aa0000; }
select optgroup { font-style:normal; font-weight:bold; color:#495057; }
</style>
</head>

<script>
function toggleUrl() {
  var el = document.getElementById("url-expanded");
  var link = document.getElementById("url-toggle-link");
  var open = el.classList.toggle("open");
  link.textContent = open ? "einklappen ▴" : "ändern ▾";
}

function onUrlChange(val) {
  try {
    var host = new URL(val).hostname || val;
    document.getElementById("url-display").textContent = host;
  } catch(e) {}
  loadKvs(val);
}

function loadKvs(baseUrl) {
  baseUrl = baseUrl.replace(/\/+$/, "");
  var sel = document.getElementById("kv-select");
  sel.innerHTML = "<option disabled selected>Lade…</option>";
  var script = document.createElement("script");
  script.src = baseUrl + "/js/kreisverbaende.js?_=" + Date.now();
  script.onload = function() {
    if (window.kreisverbaende) populateKvs(window.kreisverbaende);
    document.head.removeChild(script);
  };
  script.onerror = function() {
    sel.innerHTML = "<option disabled selected>Nicht erreichbar</option>";
    document.head.removeChild(script);
  };
  document.head.appendChild(script);
}

function populateKvs(list) {
  var sel = document.getElementById("kv-select");
  var groups = {};
  list.filter(function(k){ return k.active; }).forEach(function(k){
    if (!groups[k.organisation]) groups[k.organisation] = [];
    groups[k.organisation].push(k);
  });
  var html = "";
  Object.keys(groups).sort().forEach(function(org){
    html += "<optgroup label='" + org + "'>";
    groups[org].sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(k){
      html += "<option value='" + k.id + "'>"+k.name+"</option>";
    });
    html += "</optgroup>";
  });
  sel.innerHTML = html;
}
</script>
